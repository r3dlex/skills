# prek configuration — pre-commit hook manager (Rust-based, github.com/j178/prek)
# Schema mirrors `.pre-commit-config.yaml` (top-level `repos` field).

[[repos]]
repo = "local"

[[repos.hooks]]
id = "validate-rules"
name = "Validate Archgate rules structure"
entry = "bash scripts/validate-rules.sh"
language = "system"
files = '\.rules\.ts$'
exclude = '^reference/golden-(skills|root)/'
pass_filenames = false

[[repos.hooks]]
id = "ts-noemit"
name = "TypeScript strict noEmit"
entry = "bash -c 'if [[ -d ts-tooling ]]; then cd ts-tooling && npx tsc --noEmit --project tsconfig.json; fi'"
language = "system"
pass_filenames = false

[[repos.hooks]]
id = "ts-eslint"
name = "TypeScript eslint"
entry = "bash -c 'if [[ -d ts-tooling ]]; then cd ts-tooling && npx eslint --max-warnings 0 src/**/*.mts; fi'"
language = "system"
pass_filenames = false

[[repos.hooks]]
id = "legacy-freeze"
name = "Legacy freeze ratchet"
entry = "bash -c 'if [[ -f scripts/lib/check-legacy-freeze.mjs ]]; then node scripts/lib/check-legacy-freeze.mjs; fi'"
language = "system"
pass_filenames = false
