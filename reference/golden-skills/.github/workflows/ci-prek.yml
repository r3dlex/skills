name: AI SDLC Pre-commit Checks

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

jobs:
  prek-check:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned node
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Install legacy tools
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          curl -fsSL -o /tmp/shfmt https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64
          sudo install -m 755 /tmp/shfmt /usr/local/bin/shfmt
          curl -fsSL https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" tool install ruff
          "$HOME/.local/bin/uv" tool install mypy
          "$HOME/.local/bin/uv" tool install xenon

      - name: Install ts-tooling
        working-directory: ts-tooling
        run: npm ci --ignore-scripts

      - name: Run prek
        uses: j178/prek-action@v2
        with:
          extra-args: '--all-files'
