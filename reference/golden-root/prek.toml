# prek configuration — pre-commit hook manager (Rust-based, github.com/j178/prek)
# Schema mirrors `.pre-commit-config.yaml` (top-level `repos` field).

[[repos]]
repo = "local"

[[repos.hooks]]
id = "validate-rules"
name = "Validate Archgate rules structure"
entry = "bash scripts/validate-rules.sh"
language = "system"
files = '\.rules\.ts$'
exclude = '^reference/golden-(skills|root)/'
pass_filenames = false

[[repos.hooks]]
id = "ts-noemit"
name = "TypeScript strict noEmit"
entry = "bash -c 'test -d ts-tooling && cd ts-tooling && npx tsc --noEmit --project tsconfig.json'"
language = "system"
pass_filenames = false

[[repos.hooks]]
id = "ts-eslint"
name = "TypeScript eslint"
entry = "bash -c 'test -d ts-tooling && cd ts-tooling && npx eslint --max-warnings 0 src/**/*.mts'"
language = "system"
pass_filenames = false

[[repos.hooks]]
id = "ts-build-drift"
name = "TypeScript build drift"
entry = "bash -c 'set -euo pipefail; test -d ts-tooling; test -f ts-tooling/tsconfig.build.json; drift=$(mktemp -d); rsync -a --exclude node_modules --exclude build ts-tooling \"$drift/\"; ln -s \"$PWD/ts-tooling/node_modules\" \"$drift/ts-tooling/node_modules\"; (cd \"$drift/ts-tooling\" && npx tsc --project tsconfig.build.json --pretty false); diff -rq \"$drift/scripts/lib\" scripts/lib; rm -rf \"$drift\"'"
language = "system"
pass_filenames = false

[[repos.hooks]]
id = "legacy-freeze"
name = "Legacy freeze ratchet"
entry = "bash -c 'test -f scripts/lib/check-legacy-freeze.mjs && command -v ruff >/dev/null && command -v mypy >/dev/null && command -v xenon >/dev/null && command -v shellcheck >/dev/null && command -v shfmt >/dev/null && node scripts/lib/check-legacy-freeze.mjs'"
language = "system"
pass_filenames = false
